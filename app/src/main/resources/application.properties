spring.application.name=app

# URL cua service AI (Python core). Doi neu core chay cong/host khac.
core.base-url=http://localhost:8000

# JSON cua core dung snake_case (skill_id, gap_score, total_jd...) -> map sang camelCase DTO.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# Upload CV
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Thymeleaf: tat cache khi dev de sua template thay ngay.
spring.thymeleaf.cache=false

server.port=8080
